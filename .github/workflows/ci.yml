name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_CACHE: local:rw,remote:rw
      TURBO_RUN_SUMMARY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch pinned source objects
        run: pnpm sources:fetch
      - name: Check and test
        # 6882060, 4 cores/16 GB: median N1=479s, N2=265s, N4=271s; N2 worst test=39.13% of budget.
        env:
          LANDMINES_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm turbo run check test build --concurrency=2
      - name: Report Turbo cache story
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .turbo
          pnpm --silent turbo:summary --surface "${{ github.event_name == 'pull_request' && 'pr' || 'main' }}" --ref "$GITHUB_REF" | tee .turbo/cache-story.jsonl
          {
            printf '\n### Turbo cache story\n\n```json\n'
            cat .turbo/cache-story.jsonl
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs
          path: |
            .turbo/runs/*.json
            .turbo/cache-story.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
