verifyDepsBeforeRun: error

overrides:
  kysely: 0.29.4
  "@foldkit/vite-plugin>@effect/platform-node": 4.0.7
  "@foldkit/vite-plugin>@effect/platform-node-shared": 4.0.7

# Foldkit peer-pins effect and @effect/platform-browser to exactly 4.0.0.
# These allowances travel with patches/@foldkit__vite-plugin@0.28.0.patch;
# vendor/README.md "Patched packages" says why and when to remove both.
peerDependencyRules:
  allowedVersions:
    "foldkit>effect": 4.0.7
    "foldkit>@effect/platform-browser": 4.0.7
    "@foldkit/ui>effect": 4.0.7
    "@foldkit/devtools>effect": 4.0.7
    "@foldkit/devtools>@effect/platform-browser": 4.0.7
    "@foldkit/vite-plugin>effect": 4.0.7
    "@foldkit/markdown>effect": 4.0.7

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true

# Exact fresh pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  - "tsrs@0.20.1-ts7.1.0-beta"
  - "@yielded/effect-tsrs@0.2.3"
  - "@yielded/effect-tsrs-linux-x64@0.2.3"
  - "@yielded/effect-tsrs-linux-arm64@0.2.3"
  - "@yielded/effect-tsrs-darwin-x64@0.2.3"
  - "@yielded/effect-tsrs-darwin-arm64@0.2.3"
  - "@yielded/effect-tsrs-win32-x64@0.2.3"
  # Effect 4 unblock: stable runtime and adapters replace removed unstable imports.
  - "@alchemy.run/better-auth@2.0.0-beta.84"
  - alchemy@2.0.0-beta.84
  - effect@4.0.7
  - "@foldkit/oxlint-plugin@0.15.3"
  - foldkit@0.169.0
  - "@foldkit/ui@0.169.0"
  - "@foldkit/devtools@0.169.0"
  - "@foldkit/vite-plugin@0.28.0"
  - "@effect/platform-browser@4.0.7"
  - "@effect/platform-node@4.0.7"
  - "@effect/platform-node-shared@4.0.7"
  - "@effect/sql-pg@4.0.7"
  - "@effect/sql-d1@4.0.7"
  - "@effect/sql-sqlite-do@4.0.7"
  - "@effect/vitest@4.0.7"
