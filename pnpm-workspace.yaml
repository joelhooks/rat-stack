verifyDepsBeforeRun: error

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true

# Exact fresh pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  # Effect 4 unblock: stable runtime and adapters replace removed unstable imports.
  - "@alchemy.run/better-auth@2.0.0-beta.80"
  - alchemy@2.0.0-beta.80
  - effect@4.0.0
  - "@effect/atom-react@4.0.0"
  - "@effect/platform-node@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/sql-pg@4.0.0"
  - "@effect/sql-d1@4.0.0"
  - "@effect/sql-sqlite-do@4.0.0"
  - "@effect/vitest@4.0.0"
  - xstate@6.0.0-alpha.63
  - "@xstate/effect@0.1.0-alpha.6"
  - "@distilled.cloud/aws@1.0.0-rc.13"
  - "@distilled.cloud/axiom@1.0.0-rc.13"
  - "@distilled.cloud/cloudflare@1.0.0-rc.13"
