verifyDepsBeforeRun: error

overrides:
  kysely: 0.29.4

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true

# Exact fresh pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  - "@yielded/effect-tsrs@0.2.0"
  - "@yielded/effect-tsrs-linux-x64@0.2.0"
  - "@yielded/effect-tsrs-linux-arm64@0.2.0"
  - "@yielded/effect-tsrs-darwin-x64@0.2.0"
  - "@yielded/effect-tsrs-darwin-arm64@0.2.0"
  - "@yielded/effect-tsrs-win32-x64@0.2.0"
  # Effect 4 unblock: stable runtime and adapters replace removed unstable imports.
  - "@alchemy.run/better-auth@2.0.0-beta.83"
  - alchemy@2.0.0-beta.83
  - effect@4.0.0
  - "@foldkit/oxlint-plugin@0.15.3"
  - "@effect/platform-node@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/sql-pg@4.0.0"
  - "@effect/sql-d1@4.0.0"
  - "@effect/sql-sqlite-do@4.0.0"
  - "@effect/vitest@4.0.0"
