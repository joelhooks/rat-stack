verifyDepsBeforeRun: error

overrides:
  kysely: 0.29.4

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  alchemy-turbo-cache: true
  "@google/genai": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true

# Exact fresh pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  - "tsrs@0.23.0-ts7.1.0-beta"
  - "@yielded/effect-tsrs@0.2.3"
  - "@yielded/effect-tsrs-linux-x64@0.2.3"
  - "@yielded/effect-tsrs-linux-arm64@0.2.3"
  - "@yielded/effect-tsrs-darwin-x64@0.2.3"
  - "@yielded/effect-tsrs-darwin-arm64@0.2.3"
  - "@yielded/effect-tsrs-win32-x64@0.2.3"
  # Effect 4 unblock: stable runtime and adapters replace removed unstable imports.
  - "@alchemy.run/better-auth@2.0.0-beta.87"
  - alchemy@2.0.0-beta.87
  - effect@4.1.4
  - "@foldkit/oxlint-plugin@0.15.4"
